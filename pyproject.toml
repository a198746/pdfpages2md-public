[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfpages2md"
version = "0.1.0"
description = "Selective, page-exact PDF to Markdown/text/JSON conversion with targeted OCR"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "pdfpages2md contributors" }]
dependencies = [
    "pymupdf>=1.24",
    "pymupdf4llm>=0.0.23",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
rapidocr = ["rapidocr-onnxruntime>=1.3"]

[project.scripts]
pdfpages2md = "pdfpages2md.cli:main"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["pdfpages2md*"]
